[project]
name = "delta-miniapp-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiogram==3.30.0",
  "aiosqlite==0.22.1",
  "eth-account==0.14.0",
  "fastapi==0.116.1",
  "pydantic-settings==2.12.0",
  "pycryptodome==3.23.0",
  "uvicorn[standard]==0.35.0",
  "web3==7.16.0",
  "websockets==15.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
